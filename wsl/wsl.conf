# Baked into /etc/wsl.conf at build time. See:
# https://learn.microsoft.com/en-us/windows/wsl/wsl-config
#
# [user] default= is deliberately absent here: no non-root user exists yet at
# image-build time. wsl/apply-default-user.sh writes it in once the real,
# unmodified omarchy-provision-owner (triggered from root's shell startup —
# see wsl/arm-first-boot.sh) creates the real user. Until then WSL starts
# the instance as root, which is what the provisioning flow needs anyway.

[boot]
systemd=true

[network]
# WSL2's own host-managed NAT already generates a working /etc/resolv.conf
# pointing at the host's DNS on every boot. We don't run systemd-resolved
# (see docs/install-audit.md), so leave WSL's own generation on.
generateResolvConf=true

[interop]
# Leave Windows interop (running .exe from WSL, PATH appending) at its default
# (enabled) — nothing in this project needs it disabled, and disabling it is
# a surprising default for anyone coming from a normal WSL distro.
