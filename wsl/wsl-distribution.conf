# Baked into /etc/wsl-distribution.conf at build time. This is WSL's own,
# officially documented first-run mechanism (supported since WSL 2.4.4) —
# https://learn.microsoft.com/en-us/windows/wsl/build-custom-distro — the
# same one Ubuntu/Debian's WSL distros use for their "create a UNIX user"
# prompt. WSL's own launcher runs `oobe.command` the first time a shell is
# opened, before any shell/rc-file layer is even involved — which is why
# this replaces an earlier `.bashrc`/`PROMPT_COMMAND`-based approach that
# kept hitting real, repeatable timing/rendering issues on actual hardware
# (see docs/install-audit.md's incident write-up). This is the correct,
# supported mechanism, not a workaround.

[oobe]
command = /usr/local/bin/omarchy-wsl-oobe
defaultUid = 1000
defaultName = omarchy

[shortcut]
enabled = true

[windowsterminal]
enabled = true
