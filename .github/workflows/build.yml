name: Build omarchy-v1.wsl

# Not on every push: each run pulls real omarchy-org packages and produces a
# multi-GB artifact. Push a tag matching packages/OMARCHY_VERSION_PIN
# (v4.0.4-1, or v4.0.4-1.1 for a rebuild of the same version) to build that
# version, or run it from the Actions tab. The image stays an artifact rather
# than a release asset because it exceeds GitHub's 2 GiB per-file release limit.
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the pinned omarchy version
        if: github.ref_type == 'tag'
        run: |
          source packages/OMARCHY_VERSION_PIN
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$OMARCHY_VERSION" && "$tag" != "$OMARCHY_VERSION".* ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match OMARCHY_VERSION_PIN ($OMARCHY_VERSION)"
            exit 1
          fi

      # GitHub-hosted runners have ~14 GB free by default. This build pulls
      # the archlinux:latest image, ~1GB+ of real omarchy packages, and then
      # writes out the uncompressed target plus two ~3GB copies of the final
      # artifact (.tar.gz and .wsl) — comfortably over that without some
      # headroom. Reclaim space from large preinstalled toolchains this repo
      # never uses, rather than touching build/build.sh itself.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h /

      # build/build.sh is run completely unmodified — same script, same
      # container, same output, as a local build. See PLAN.md/README.md for
      # what it actually does.
      - name: Build
        run: ./build/build.sh

      - name: Show build manifest
        run: cat dist/build-manifest.json

      # Only the .wsl artifact (the supported install path — see README.md)
      # plus its checksum and the build manifest. dist/omarchy-v1.tar.gz is
      # the identical bytes under a different name (kept locally for
      # debugging) — uploading it too would just double the stored size for
      # no benefit.
      - name: Upload omarchy-v1.wsl
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-${{ github.ref_type == 'tag' && github.ref_name || 'v1' }}.wsl
          path: |
            dist/omarchy-v1.wsl
            dist/omarchy-v1.wsl.sha256
            dist/build-manifest.json
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}
          if-no-files-found: error
